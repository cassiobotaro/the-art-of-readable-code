name: main

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync

      - name: Run ruff format
        run: uv run ruff format --check .

      - name: Run ruff
        run: uv run ruff check .

      - name: Run ty
        run: uv run ty check
